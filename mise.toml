min_version = "2026.11.0"

[settings]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "macos-x64"]

[tools]
node = "26"

[env]
DO_NOT_TRACK = "1"

[tasks.install]
description = "Install the blog's build tools from package-lock.json"
run = "npm ci --no-audit --no-fund"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.build]
description = "Build the blog into blog/ and refresh sitemap.xml, llms*.txt and the Markdown pages"
depends = ["install"]
# blog/ holds only build output, so it is rebuilt from nothing and the pages of removed posts go.
run = ["rm -rf blog", "npm run build:blog"]

[tasks.discovery]
description = "Regenerate sitemap.xml, llms.txt, llms-full.txt and the Markdown copy of every page"
# They are written from the built pages at the end of every build, so this is a full build.
depends = ["build"]

[tasks.watch]
description = "Rebuild the blog whenever a source changes"
depends = ["install"]
run = "npm run watch:blog"

[tasks.serve]
description = "Serve the site from the repository root on http://127.0.0.1:8765 (PORT changes the port)"
run = "python3 tools/serve.py"

[tasks.check]
description = "Build a commit (HEAD by default) in a temporary worktree; fail if its built site is stale"
depends = ["install"]
run = "tools/check-site.sh"

[tasks.dist]
description = "Stage the files the host serves into dist/, from a commit (HEAD by default)"
run = "tools/dist.sh"

[tasks.deploy]
description = "Deploy dist/ from this machine with the Wrangler login here; tags deploy through CI"
depends = ["dist"]
# the same Wrangler as .github/workflows/deploy.yml
run = "npx --yes wrangler@4.168.0 deploy"

[tasks.smoke]
description = "Fetch a deployment, given its base URL, and check every page and file it should serve"
run = "tools/smoke.sh"

[tasks.hooks]
description = "Run the check on every commit this clone pushes"
run = "git config core.hooksPath .githooks"
