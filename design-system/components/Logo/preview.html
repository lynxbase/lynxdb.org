<style>
  .lg { width: 1200px; padding: var(--space-8); display: grid; gap: var(--space-6); }
  .lg-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
  .lg-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-6); }
  .lg figure { margin: 0; display: grid; gap: var(--space-2); }
  .lg figcaption { display: flex; justify-content: space-between; }
  .lg figcaption span:first-child { color: var(--fg-default); }
  .lg-tile { display: grid; place-items: center; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); }
  .lg-tile[data-theme="dark"] { background: var(--bg-app); }
  .lg-hero { height: 260px; }
  .lg-hero .lx-lockup { font-size: 76px; }
  .lg-sq { height: 220px; }
  .lg-sq .lx-mark { height: 132px; }
  .lg-sq img { height: 132px; width: auto; }
  .lg-accent { background: var(--moss-700); border-color: var(--moss-700); color: var(--stone-0); }
  .lg-sizes { display: flex; align-items: flex-end; gap: var(--space-12); padding: var(--space-8); justify-content: flex-start; height: auto; }
  .lg-sizes > div { display: grid; gap: var(--space-3); justify-items: start; align-content: end; }
  .lg-sizes .lx-mark { color: var(--accent-fg); }
  .lg-rule { width: 1px; align-self: stretch; background: var(--border-default); }
  .lg-app { height: 180px; display: flex; gap: var(--space-6); align-items: center; justify-content: center; }
  .lg-app .ic { width: 96px; height: 96px; border-radius: 21px; display: grid; place-items: center; }
  .lg-app .ic .lx-mark { height: 56px; margin-left: 2px; }
  .lg-app .ic.sm { width: 48px; height: 48px; border-radius: 10px; }
  .lg-app .ic.sm .lx-mark { height: 28px; margin-left: 1px; }
  .lg-cli { font-family: var(--font-mono); font-size: 40px; line-height: 1; font-weight: 500; letter-spacing: -0.02em; color: var(--stone-200); }
  .lg-cli b { color: var(--moss-400); font-weight: 700; }
</style>
