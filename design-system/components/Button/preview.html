<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — LynxDB</title></head>
<body>
<div class="lx-row">
  <button class="lx-btn lx-btn--primary" type="button">Run <span class="lx-kbd">⌘↵</span></button>
  <button class="lx-btn" type="button">Explain</button>
  <button class="lx-btn lx-btn--ghost" type="button">Cancel</button>
  <button class="lx-btn lx-btn--danger" type="button">Drop view</button>
  <button class="lx-btn" type="button" disabled>Disabled</button>
  <button class="lx-btn lx-btn--sm" type="button">Last 5 minutes</button>
  <button class="lx-btn lx-btn--ghost lx-btn--sm" type="button">Clear</button>
</div>
<div class="lx-row" style="padding-top:0">
  <button class="lx-btn lx-btn--primary lx-btn--lg" type="button">Get started</button>
  <button class="lx-btn lx-btn--ink lx-btn--lg" type="button">Read the quick start</button>
  <button class="lx-btn lx-btn--lg" type="button">See the benchmark</button>
  <button class="lx-btn lx-btn--ghost lx-btn--lg" type="button">GitHub</button>
</div>
</body>
</html>
